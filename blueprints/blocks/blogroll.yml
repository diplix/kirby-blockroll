name: Blogroll
icon: url
wysiwyg: true
preview: fields
fields:
  name:
    label: Name
    type: text
    default: Blogroll
    width: 1/2
    help: Bezeichnung dieser Sammlung (Frontend p-name, OPML-Titel). Pro Block überschreibbar.
  links:
    label: Links
    type: structure
    columns:
      photo:
        label: " "
        width: 1/16
        mobile: true
      url:
        width: 5/12
        mobile: true
      name:
        width: 1/4
        mobile: true
      xfn:
        width: 1/4
    fields:
      url:
        label: URL
        type: blockroll-url
        required: true
        width: 1/2
        help: Nach dem Einfügen auf Discover klicken — leere Felder werden befüllt.
      active:
        label: Aktiv
        type: toggle
        default: true
        width: 1/2
      name:
        label: Name
        type: text
        width: 1/2
        help: Leer lassen und Discover nutzen
      feedUrl:
        label: Feed-URL
        type: url
        width: 1/2
      description:
        label: Beschreibung
        type: textarea
        buttons: false
        help: KirbyText erlaubt (z. B. Links). Wird als p-note gerendert.
      photo:
        label: Avatar / Icon URL
        type: url
        help: In der Tabellenübersicht als Bild; im Editor normale URL
      xfn:
        label: XFN
        type: multiselect
        options:
          friend: friend
          acquaintance: acquaintance
          contact: contact
          met: met
          co-worker: co-worker
          colleague: colleague
          co-resident: co-resident
          neighbor: neighbor
          child: child
          parent: parent
          sibling: sibling
          spouse: spouse
          kin: kin
          muse: muse
          crush: crush
          date: date
          sweetheart: sweetheart
          me: me
      added:
        label: Hinzugefügt
        type: date
        default: today
        width: 1/2
  sortBy:
    label: Sortierung
    type: select
    default: name
    options:
      name: Nach Name
      added: Neueste zuerst
      manual: Manuell (Reihenfolge oben)
    width: 1/3
  showAvatars:
    label: Avatare
    type: toggle
    default: true
    width: 1/3
  showXfn:
    label: XFN anzeigen
    type: toggle
    default: false
    width: 1/3
